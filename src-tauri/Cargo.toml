[package]
name = "sub-sub-title"
version = "0.1.0"
description = "Speaker-coloured subtitle editor"
authors = ["Magnus"]
edition = "2021"

[lib]
name = "sub_sub_title_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
encoding_rs = "0.8"
thiserror = "2"
harper-core = "2.8.0"
# Speech to text: streaming the engine download and unpacking its .7z.
sevenz-rust2 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
